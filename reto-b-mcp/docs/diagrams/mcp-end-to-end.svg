<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-labelledby="title desc">
  <title id="title">Reto B — arquitectura end-to-end del gateway MCP</title>
  <desc id="desc">AIFindr usa OAuth de Auth0 y el túnel HTTPS temporal de ngrok para llamar al Gateway MCP. La confirmación humana pasa por la UI web y el worker ejecuta una acción simulada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#0a1522"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102d43"/><stop offset="1" stop-color="#101d2c"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#103a37"/><stop offset="1" stop-color="#102421"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3a2c14"/><stop offset="1" stop-color="#262014"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3a1920"/><stop offset="1" stop-color="#251418"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000" flood-opacity=".4"/></filter>
    <marker id="arrT" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L11 5L0 10Z" fill="#59d4c5"/></marker>
    <marker id="arrA" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L11 5L0 10Z" fill="#f2bd5d"/></marker>
    <marker id="arrR" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L11 5L0 10Z" fill="#f37783"/></marker>
    <style>
      .lane{fill:#091624;stroke:#294154;stroke-width:1.5}.node{filter:url(#shadow);stroke-width:2}.h{font:800 27px 'DejaVu Sans',sans-serif}.b{font:400 19px 'DejaVu Sans',sans-serif}.m{font:700 17px 'DejaVu Sans Mono',monospace}.s{font:700 15px 'DejaVu Sans',sans-serif}.flow{fill:none;stroke:#59d4c5;stroke-width:3.5;marker-end:url(#arrT)}.auth{fill:none;stroke:#f2bd5d;stroke-width:3;marker-end:url(#arrA)}.deny{fill:none;stroke:#f37783;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrR)}
    </style>
  </defs>
  <rect width="1900" height="1120" fill="url(#bg)"/>
  <text x="70" y="64" class="m" fill="#59d4c5">RETO B · ARQUITECTURA Y FRONTERAS DE CONFIANZA</text>
  <text x="70" y="116" class="h" fill="#f5f8fc">El agente propone; la persona confirma; el worker ejecuta el efecto simulado.</text>
  <text x="70" y="150" class="b" fill="#a9b9ca">El túnel ngrok solo expone HTTPS temporalmente. La autoridad de negocio vive en el gateway, no en el LLM.</text>

  <rect class="lane" x="50" y="205" width="520" height="460" rx="28"/><text x="78" y="244" class="m" fill="#8ec9ff">HOST AIFINDR DEV</text>
  <rect class="node" x="86" y="282" width="448" height="150" rx="20" fill="url(#blue)" stroke="#4389b8"/>
  <text x="116" y="326" class="h" fill="#f5f8fc">Agent Workflow</text><text x="116" y="357" class="b" fill="#c8d8e8">Decide cuándo invocar tools.</text><text x="116" y="389" class="s" fill="#8ec9ff">No confirma, no ejecuta, no reintenta.</text>
  <rect class="node" x="86" y="468" width="448" height="154" rx="20" fill="#101e2c" stroke="#4389b8"/>
  <text x="116" y="512" class="h" fill="#f5f8fc">Custom MCP habilitado</text><text x="116" y="543" class="b" fill="#c8d8e8">allowlist exacta de tres tools:</text><text x="116" y="574" class="m" fill="#8ec9ff">get_card_status · propose_action</text><text x="116" y="601" class="m" fill="#8ec9ff">get_action_status</text>

  <rect class="lane" x="650" y="205" width="260" height="460" rx="28"/><text x="678" y="244" class="m" fill="#f2bd5d">IDENTIDAD</text>
  <rect class="node" x="682" y="330" width="196" height="190" rx="20" fill="url(#amber)" stroke="#d69e41"/>
  <text x="712" y="374" class="h" fill="#fff5dd">Auth0</text><text x="712" y="407" class="b" fill="#f4dbad">Authorization Code</text><text x="712" y="436" class="b" fill="#f4dbad">+ PKCE</text><text x="712" y="469" class="m" fill="#ffd784">RS256 · bank:actions</text>

  <rect class="lane" x="990" y="205" width="340" height="460" rx="28"/><text x="1018" y="244" class="m" fill="#f2bd5d">BORDE PÚBLICO TEMPORAL</text>
  <rect class="node" x="1024" y="330" width="272" height="190" rx="20" fill="url(#amber)" stroke="#d69e41"/>
  <text x="1054" y="374" class="h" fill="#fff5dd">ngrok HTTPS</text><text x="1054" y="407" class="b" fill="#f4dbad">PUBLIC_ORIGIN/mcp</text><text x="1054" y="439" class="b" fill="#f4dbad">Túnel a loopback local</text><text x="1054" y="477" class="s" fill="#ffd784">No equivale a producción.</text>

  <rect class="lane" x="1410" y="205" width="440" height="460" rx="28"/><text x="1438" y="244" class="m" fill="#8deddc">GATEWAY LOCAL</text>
  <rect class="node" x="1444" y="282" width="372" height="150" rx="20" fill="url(#teal)" stroke="#43a996"/>
  <text x="1474" y="326" class="h" fill="#effffb">Rails + MCP</text><text x="1474" y="357" class="b" fill="#c9eee6">Valida JWT: iss, aud, exp, sub, jti, scope.</text><text x="1474" y="389" class="s" fill="#8deddc">Schema cerrado · máximo 16 KiB</text>
  <rect class="node" x="1444" y="468" width="372" height="154" rx="20" fill="#102b29" stroke="#43a996"/>
  <text x="1474" y="512" class="h" fill="#effffb">Dominio + SQLite WAL</text><text x="1474" y="543" class="b" fill="#c9eee6">Estados, idempotencia y grants hasheados.</text><text x="1474" y="568" class="b" fill="#c9eee6">Auditoría HMAC.</text><text x="1474" y="601" class="s" fill="#8deddc">Única autoridad de negocio.</text>

  <path class="auth" d="M570 344H682"/><text x="581" y="323" class="m" fill="#ffd784">1 · OAuth</text>
  <path class="auth" d="M682 500H570"/><text x="575" y="535" class="m" fill="#ffd784">2 · JWT delegado</text>
  <path class="flow" d="M534 545H1024"/><text x="715" y="579" class="m" fill="#8deddc">3 · HTTPS MCP + Bearer</text>
  <path class="flow" d="M1296 425H1444"/><text x="1335" y="401" class="m" fill="#8deddc">4 · túnel</text>

  <rect class="lane" x="50" y="740" width="1800" height="310" rx="28"/><text x="78" y="781" class="m" fill="#8deddc">CONFIRMACIÓN Y EJECUCIÓN: CAMINO FUERA DEL MCP</text>
  <rect class="node" x="110" y="827" width="300" height="155" rx="20" fill="#172433" stroke="#728da6"/>
  <text x="140" y="869" class="h" fill="#f5f8fc">Persona</text><text x="140" y="902" class="b" fill="#c8d8e8">Recibe enlace de un uso.</text><text x="140" y="934" class="s" fill="#a9c7e3">Revisa y decide.</text>
  <rect class="node" x="530" y="827" width="340" height="155" rx="20" fill="url(#amber)" stroke="#d69e41"/>
  <text x="560" y="869" class="h" fill="#fff5dd">UI web /c/{grant}</text><text x="560" y="902" class="b" fill="#f4dbad">HTTPS, sesión, CSRF y Origin.</text><text x="560" y="934" class="s" fill="#ffd784">CONFIRMED, todavía sin efecto.</text>
  <rect class="node" x="1010" y="827" width="340" height="155" rx="20" fill="url(#teal)" stroke="#43a996"/>
  <text x="1040" y="869" class="h" fill="#effffb">Worker durable</text><text x="1040" y="902" class="b" fill="#c9eee6">Consume solo acciones confirmadas.</text><text x="1040" y="934" class="s" fill="#8deddc">Un efecto por action_id.</text>
  <rect class="node" x="1470" y="827" width="300" height="155" rx="20" fill="#16342d" stroke="#43a996"/>
  <text x="1500" y="869" class="h" fill="#effffb">Core simulado</text><text x="1500" y="902" class="b" fill="#c9eee6">Acción EXECUTED.</text><text x="1500" y="934" class="s" fill="#8deddc">Tarjeta BLOCKED.</text>
  <path class="flow" d="M410 905H530"/><text x="429" y="884" class="m" fill="#8deddc">5 · GET / POST</text>
  <path class="flow" d="M870 905H1010"/><text x="884" y="884" class="m" fill="#8deddc">6 · cola durable</text>
  <path class="flow" d="M1350 905H1470"/><text x="1370" y="884" class="m" fill="#8deddc">7 · efecto</text>
  <path class="deny" d="M534 612C660 700 850 700 1010 612"/><text x="662" y="690" class="m" fill="#ffadb6">La confirmación nunca cruza MCP</text>
</svg>
