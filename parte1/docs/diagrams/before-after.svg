<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Parte 1 — comparación antes y después</title>
  <desc id="desc">El baseline de veinte casos pasa de quince aprobados a veinte después de una regla de aclaración mínima en Agent Workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#0b1526"/></linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#341820"/><stop offset="1" stop-color="#171b2a"/></linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10372f"/><stop offset="1" stop-color="#172431"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#57d3c4"/></marker>
    <style>
      .k{font:700 18px 'DejaVu Sans Mono',monospace;letter-spacing:3px}.h{font:800 44px 'DejaVu Sans',sans-serif}.b{font:400 25px 'DejaVu Sans',sans-serif}.s{font:700 20px 'DejaVu Sans',sans-serif}.m{font:800 72px 'DejaVu Sans Mono',monospace}.n{font:700 18px 'DejaVu Sans Mono',monospace}.card{stroke-width:2;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 90H1600M0 810H1600" stroke="#244158" stroke-width="1"/>
  <text x="90" y="88" class="k" fill="#57d3c4">PARTE 1 · EVIDENCIA PAREADA</text>
  <text x="90" y="155" class="h" fill="#f5f8fc">Una pregunta mínima cambió el patrón de recomendación.</text>
  <text x="90" y="198" class="b" fill="#a9b9ca">20 casos congelados · mismo Agent Workflow, modelo, KB y tools · una sola variable modificada</text>

  <g transform="translate(90 270)">
    <rect class="card" width="635" height="420" rx="28" fill="url(#bad)" stroke="#e56d79"/>
    <text x="42" y="56" class="k" fill="#ff9ea8">ANTES · BASELINE</text>
    <text x="42" y="126" class="m" fill="#fff1f2">15 / 20</text><text x="350" y="118" class="s" fill="#ffd8dd">75% correcto</text>
    <path d="M42 160H593" stroke="#8d414c"/>
    <rect x="42" y="197" width="170" height="69" rx="15" fill="#222a3b" stroke="#5c6575"/>
    <text x="62" y="226" class="n" fill="#b9c6d4">PETICIÓN ABIERTA</text><text x="62" y="250" class="s" fill="#eef3f8">“¿Qué tarjeta?”</text>
    <path d="M224 231H304" stroke="#e56d79" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="316" y="197" width="170" height="69" rx="15" fill="#35212a" stroke="#e56d79"/>
    <text x="340" y="226" class="n" fill="#ffb4bd">CATÁLOGO</text><text x="340" y="250" class="s" fill="#fff1f2">antes del criterio</text>
    <path d="M498 231H548" stroke="#e56d79" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="42" y="323" class="b" fill="#d8e0ea">Cinco fallos de aclaración:</text>
    <text x="42" y="364" class="s" fill="#f1f4f7">• Presentó opciones antes de conocer el uso o propósito.</text>
    <text x="42" y="402" class="s" fill="#f1f4f7">• 1,346–2,153 caracteres en ejemplos representativos.</text>
  </g>

  <path d="M754 480H842" stroke="#57d3c4" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="723" y="397" width="150" height="58" rx="29" fill="#112d30" stroke="#57d3c4" stroke-width="2"/>
  <text x="748" y="433" class="n" fill="#8ff0df">UNA REGLA</text>

  <g transform="translate(875 270)">
    <rect class="card" width="635" height="420" rx="28" fill="url(#good)" stroke="#57d3c4"/>
    <text x="42" y="56" class="k" fill="#8ff0df">DESPUÉS · PROMPT PUBLICADO</text>
    <text x="42" y="126" class="m" fill="#f1fffb">20 / 20</text><text x="350" y="118" class="s" fill="#aaffeb">100% correcto</text>
    <path d="M42 160H593" stroke="#34786f"/>
    <rect x="42" y="197" width="170" height="69" rx="15" fill="#222a3b" stroke="#5c6575"/>
    <text x="62" y="226" class="n" fill="#b9c6d4">PETICIÓN ABIERTA</text><text x="62" y="250" class="s" fill="#eef3f8">“¿Qué tarjeta?”</text>
    <path d="M224 231H304" stroke="#57d3c4" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="316" y="197" width="222" height="69" rx="15" fill="#173a35" stroke="#57d3c4"/>
    <text x="340" y="226" class="n" fill="#8ff0df">ACLARACIÓN MÍNIMA</text><text x="340" y="250" class="s" fill="#effffb">uso, objetivo o beneficio</text>
    <text x="42" y="323" class="b" fill="#d8f0ea">Resultado reproducible:</text>
    <text x="42" y="364" class="s" fill="#f1fffb">• 5 fail → pass · 14 controles preservados.</text>
    <text x="42" y="402" class="s" fill="#f1fffb">• 0 regresiones pass → fail · 0 fallos críticos.</text>
  </g>
  <text x="90" y="762" class="n" fill="#a9b9ca">LÍMITE: evidencia sobre este dataset y esta configuración; no es una medición de producción ni de estabilidad estadística.</text>
</svg>
